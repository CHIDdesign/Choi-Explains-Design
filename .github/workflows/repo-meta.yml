# 저장소 상단의 설명(About)·토픽을 .github/repo-meta.json 과 맞춘다.
# Claude Code 세션의 GitHub 프록시는 저장소 설정 쓰기를 막으므로(403), 이 워크플로가 대신 한다.
# 한 번만: 저장소 Settings › Secrets and variables › Actions 에 Administration(write) 권한의
# fine-grained 토큰을 REPO_ADMIN_TOKEN 으로 넣는다. 이후에는 repo-meta.json 을 고쳐 push 하면 자동으로 적용된다.
name: 저장소 설명·토픽 동기화
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/repo-meta.json", ".github/workflows/repo-meta.yml"]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 설명·토픽 적용
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::REPO_ADMIN_TOKEN 비밀이 없어 건너뜁니다 — Settings › Secrets and variables › Actions 에 Administration(write) 권한 토큰을 REPO_ADMIN_TOKEN 으로 넣고 다시 실행하세요."
            exit 0
          fi
          desc=$(jq -r '.description' .github/repo-meta.json)
          home=$(jq -r '.homepage // ""' .github/repo-meta.json)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f description="$desc" -f homepage="$home" --jq '"설명: " + .description'
          jq -c '{names: .topics}' .github/repo-meta.json | gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" --input - --jq '"토픽: " + (.names | join(", "))'
